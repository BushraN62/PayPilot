<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}PayPilot{% endblock %}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="pp-body">

    <nav class="navbar pp-navbar">
        <div class="container-xl d-flex flex-wrap align-items-center justify-content-between">
            <a class="navbar-brand pp-brand" href="{{ url_for('home') }}">PayPilot</a>

            <ul class="navbar-nav pp-nav-list flex-row gap-3 mb-0">
                <li class="nav-item">
                    <a class="nav-link pp-nav-link" href="{{ url_for('home') }}">Home</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link pp-nav-link" href="{{ url_for('how_it_works') }}">How It Works</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link pp-nav-link" href="{{ url_for('roi') }}">ROI Explained</a>
                </li>
            </ul>
        </div>
    </nav>

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer class="pp-footer">
        <div class="container-xl">
            <p class="pp-footer-text mb-0">PayPilot. Compare colleges by financial outcomes.</p>
        </div>
    </footer>

</body>
</html>
